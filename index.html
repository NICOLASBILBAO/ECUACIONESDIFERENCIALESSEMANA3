const S={name:'',i:0,screen:'cover',ans:{},hint:{},work:{},ayo:false,t0:0,lang:'es',rate:1,greet:false,pulse:0},$=s=>document.querySelector(s),SS=window.speechSynthesis;
const GUIA={
'1a':{ins:'Resuelve el problema de valor inicial: encuentra la función y(x) que cumpla la ecuación y además pase por el punto y(0) = 1. Trabaja en papel y elige la opción igual a tu resultado final.',
st:['Reescribe e^(−y+x) = e^x · e^(−y) (propiedad de las potencias).','Separa variables: lo de y a la izquierda, lo de x a la derecha → e^y dy = 2e^x dx.','Integra ambos lados (agrega una sola constante C).','Usa y(0) = 1 (x = 0, y = 1) para calcular C.','Despeja y aplicando ln a ambos lados.'],
ph:['Como e^(a+b) = e^a·e^b, la ecuación es dy/dx = 2e^x·e^(−y). Multiplica por e^y y por dx para separar.','Queda e^y dy = 2e^x dx. Como ∫e^y dy = e^y y ∫2e^x dx = 2e^x, resulta e^y = 2e^x + C.','Con x = 0, y = 1: e^1 = 2e^0 + C → C = e − 2. Finalmente aplica ln: y = ln(2e^x + C) con ese valor de C.']},
'1b':{ins:'Resuelve el problema de valor inicial: despeja dy, integra y usa y(0) = 2 para hallar la constante. Elige la opción igual a tu resultado.',
st:['Aísla el término con dy: e^(−2x) dy = −dx.','Multiplica por e^(2x) para dejar dy solo: dy = −e^(2x) dx.','Integra: ∫dy = −∫e^(2x) dx (recuerda ∫e^(ax) dx = e^(ax)/a).','Usa y(0) = 2 para calcular C.','Escribe y(x) con el valor de C ya calculado.'],
ph:['Pasa dx al otro lado: e^(−2x) dy = −dx. Dividir entre e^(−2x) equivale a multiplicar por e^(2x).','Queda dy = −e^(2x) dx. Como ∫e^(2x) dx = e^(2x)/2, resulta y = −e^(2x)/2 + C.','Con x = 0, y = 2: 2 = −1/2 + C → C = 5/2. Escribe −e^(2x)/2 + 5/2 como una sola fracción.']},
'1c':{ins:'Resuelve el problema de valor inicial separando variables y usando y(0) = 1. Elige la opción igual a tu resultado.',
st:['Despeja la derivada: dy/dx = 3x²·y.','Separa variables: dy/y = 3x² dx.','Integra: ln|y| = x³ + C.','Aplica la exponencial: y = C·e^(x³).','Usa y(0) = 1 para calcular C.'],
ph:['Suma 3x²y a ambos lados: dy/dx = 3x²y. Divide entre y y multiplica por dx.','∫dy/y = ln|y| y ∫3x² dx = x³. Entonces ln|y| = x³ + C, o sea y = C·e^(x³).','Evalúa en x = 0: y(0) = C·e^0 = C = 1. Sustituye ese C en y = C·e^(x³).']},
'2a':{ins:'Decide si la ecuación diferencial es exacta. Si lo es, halla la solución implícita F(x,y) = C y elígela; si no lo es, elige la opción «No es exacta».',
st:['Identifica M (lo que multiplica a dx) y N (lo que multiplica a dy).','Calcula ∂M/∂y y ∂N/∂x.','Compara: si son iguales la ecuación es exacta; si no, no lo es.','Integra M respecto a x: F = ∫M dx + g(y).','Deriva F respecto a y, iguala a N y halla g(y). Escribe F = C.'],
ph:['M = e^y + 6x (acompaña a dx) y N = x·e^y (acompaña a dy).','∂M/∂y = e^y y ∂N/∂x = e^y (se deriva x, e^y queda igual). ¿Son iguales? Entonces decide si es exacta.','F = ∫(e^y + 6x) dx = x·e^y + 3x² + g(y). Al derivar en y: x·e^y + g′(y) debe ser igual a N = x·e^y, así que g′(y) = 0.']},
'2b':{ins:'Decide si la ecuación diferencial es exacta. Si lo es, halla la solución implícita F(x,y) = C y elígela; si no lo es, elige la opción «No es exacta».',
st:['Identifica M (lo que multiplica a dx) y N (lo que multiplica a dy).','Calcula ∂M/∂y y ∂N/∂x.','Compara: si son iguales la ecuación es exacta; si no, no lo es.','Integra M respecto a x: F = ∫M dx + g(y).','Deriva F respecto a y, iguala a N y halla g(y). Escribe F = C.'],
ph:['M = 3x + 7 (acompaña a dx) y N = 2y − 1 (acompaña a dy).','∂M/∂y = 0 y ∂N/∂x = 0. Son iguales, por lo tanto la ecuación es exacta.','F = ∫(3x + 7) dx = (3/2)x² + 7x + g(y). Como ∂F/∂y = g′(y) = 2y − 1, entonces g(y) = y² − y. Une todo en F = C.']},
'3a':{ins:'Es una ecuación lineal homogénea de primer orden. Se resuelve separando variables: encuentra la solución general y = C·(…) y elige la opción igual a tu resultado.',
st:['Despeja y′: y′ = (e^x/5)·y.','Separa variables: dy/y = (e^x/5) dx.','Integra ambos lados.','Aplica la exponencial y reúne las constantes en una sola C.'],
ph:['Divide entre 5 y entre y: dy/y = (e^x/5) dx.','∫dy/y = ln|y| y ∫(e^x/5) dx = e^x/5. Queda ln|y| = e^x/5 + C₁.','Aplica e^ a ambos lados: y = e^(C₁)·e^(e^x/5) = C·e^(e^x/5). El 5 se queda dentro del exponente, dividiendo a e^x.']},
'3b':{ins:'Es una ecuación lineal no homogénea de primer orden. Encuentra la solución general y = y_h + y_p y elige la opción igual a tu resultado.',

ph:['y′ + 2y = 0 → dy/y = −2 dx → y_h = C·e^(−2x).','Si y_p = A, entonces y_p′ = 0. Sustituye en la ecuación: 0 + 2A = 5.','De 2A = 5 sale A = 5/2. Suma y = y_h + y_p y revisa el signo del exponente de e.']},
'3c':{ins:'Ecuación lineal de 2.º orden con coeficientes constantes. Escríbela como y″ − 2y = 24 + 2e^(2x) y halla la solución general y = y_h + y_p. Elige la opción igual a tu resultado.',
st:['Homogénea: y″ − 2y = 0 → ecuación característica r² − 2 = 0.','Halla las raíces y escribe y_h = C₁e^(r₁x) + C₂e^(r₂x).','Propón y_p = A + B·e^(2x) (por el 24 constante y el 2e^(2x)).','Calcula y_p″, sustituye en y″ − 2y y compara coeficientes con 24 + 2e^(2x).','Suma: y = y_h + y_p.'],
ph:['r² − 2 = 0 → r = ±√2 (raíces reales distintas), así que y_h = C₁e^(√2·x) + C₂e^(−√2·x).','Con y_p = A + B·e^(2x) se tiene y_p″ = 4B·e^(2x). Entonces y_p″ − 2y_p = −2A + 2B·e^(2x).','Iguala con 24 + 2e^(2x): −2A = 24 → A = −12 y 2B = 2 → B = 1. Suma y_h + y_p.']},
'4':{ins:'Resuelve el problema de valor inicial de 2.º orden: halla la solución general y usa las DOS condiciones, y(π) = 0 y y′(π) = 1, para calcular las dos constantes. Elige la opción igual a tu resultado.',
st:['Ecuación característica: r² + 1 = 0 → r = ±i.','Solución general: y = A·cos x + B·sin x.','Deriva: y′ = −A·sin x + B·cos x.','Aplica y(π) = 0 y calcula A.','Aplica y′(π) = 1, calcula B y escribe y(x).'],
